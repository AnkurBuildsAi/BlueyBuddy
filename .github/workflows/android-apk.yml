
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ORBO_App_Source.zip"
      - "ORBO_Android_Full_Source.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find and extract Android source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ls -la

          ZIP=""
          if [ -f "ORBO_App_Source.zip" ]; then
            ZIP="ORBO_App_Source.zip"
          elif [ -f "ORBO_Android_Full_Source.zip" ]; then
            ZIP="ORBO_Android_Full_Source.zip"
          else
            ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            echo "::error::Android source ZIP nahi mili."
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          rm -rf "$GITHUB_WORKSPACE/_src"
          mkdir -p "$GITHUB_WORKSPACE/_src"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/_src"

          SETTINGS="$(find "$GITHUB_WORKSPACE/_src" -maxdepth 5 \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/build/*' | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file nahi mili."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          MODULE=""
          while IFS= read -r FILE; do
            if grep -Eq 'com\.android\.application|android\.application' "$FILE"; then
              MODULE="$(basename "$(dirname "$FILE")")"
              break
            fi
          done < <(find "$PROJECT_DIR" -mindepth 2 -maxdepth 3 \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path '*/build/*' | sort)

          if [ -z "$MODULE" ]; then
            echo "::error::Android application module nahi mila."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "MODULE=$MODULE" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: "yes"
          log-accepted-android-sdk-licenses: "false"

      - name: Patch FaceSession Kotlin compile error
        shell: bash
        run: |
          set -euo pipefail

          FACE_FILE="$PROJECT_DIR/$MODULE/src/main/java/com/orbo/assistant/face/FaceSession.kt"
          mkdir -p "$GITHUB_WORKSPACE/logs"

          if [ ! -f "$FACE_FILE" ]; then
            echo "::error::FaceSession.kt nahi mili."
            exit 1
          fi

          cp "$FACE_FILE" "$GITHUB_WORKSPACE/logs/FaceSession.original.kt"

          python3 - "$FACE_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          old = "private fun finish(ok: Boolean, msg: String, s: List<FloatArray>?) {"
          new = "private fun finish(ok: Boolean, msg: String, s: List<FloatArray>? = null) {"

          if source.count(old) == 1:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding="utf-8")
              print("PATCH APPLIED")
          elif new in source:
              print("PATCH ALREADY PRESENT")
          else:
              raise SystemExit("Expected finish() declaration nahi mili. Source check required hai.")
          PY

          cp "$FACE_FILE" "$GITHUB_WORKSPACE/logs/FaceSession.patched.kt"
          grep -n 'private fun finish' "$FACE_FILE"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p "$GITHUB_WORKSPACE/logs"

          gradle --version | tee "$GITHUB_WORKSPACE/logs/gradle-version.txt"

          set +e
          gradle ":$MODULE:assembleDebug" --stacktrace --no-daemon --console=plain 2>&1 \
            | tee "$GITHUB_WORKSPACE/logs/build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          exit "$BUILD_STATUS"

      - name: Run unit tests
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle ":$MODULE:testDebugUnitTest" --stacktrace --no-daemon --console=plain 2>&1 \
            | tee "$GITHUB_WORKSPACE/logs/unit-tests.log"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUT="$PROJECT_DIR/$MODULE/build/outputs/apk/debug"
          ls -la "$OUT"

          APK="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::APK file nahi mili."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/ORBO-debug.apk"

          sha256sum "$GITHUB_WORKSPACE/dist/ORBO-debug.apk" \
            | tee "$GITHUB_WORKSPACE/logs/apk-sha256.txt"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ORBO-debug-apk
          path: dist/ORBO-debug.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ORBO-build-diagnostics
          path: |
            logs/
            _src/**/build/reports/
            _src/**/build/test-results/
          if-no-files-found: warn
