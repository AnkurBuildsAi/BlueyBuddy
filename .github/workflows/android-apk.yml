name: Build Bluey Buddy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  build:
    name: Build Bluey Buddy Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Let this action handle SDK licenses.
      # Do not run "yes | sdkmanager --licenses".
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: ""

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT=""

          # First check whether Gradle files are already in the repository.
          if { [ -f "$ROOT/settings.gradle" ] || \
               [ -f "$ROOT/settings.gradle.kts" ]; } && \
             { [ -f "$ROOT/app/build.gradle" ] || \
               [ -f "$ROOT/app/build.gradle.kts" ]; }; then
            PROJECT="$ROOT"
          else
            # Otherwise, extract a supported source ZIP if one exists.
            mkdir -p "$ROOT/.build-source"

            for ZIP in \
              "$ROOT/BlueyBuddy-Android-Source.zip" \
              "$ROOT/BlueyBuddy-Fresh-Android-Source.zip" \
              "$ROOT/BlueyBuddy-Full-Offline-Source.zip"; do
              if [ -f "$ZIP" ]; then
                unzip -oq "$ZIP" -d "$ROOT/.build-source"
                break
              fi
            done

            # Find the Gradle project inside the extracted source.
            while IFS= read -r SETTINGS; do
              DIR="$(dirname "$SETTINGS")"

              if { [ -f "$DIR/app/build.gradle" ] || \
                   [ -f "$DIR/app/build.gradle.kts" ]; }; then
                PROJECT="$DIR"
                break
              fi
            done < <(
              find "$ROOT/.build-source" -type f \
                \( -name settings.gradle \
                -o -name settings.gradle.kts \) \
                -print 2>/dev/null
            )
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project not found."
            echo "Expected Gradle files in the repository or a supported source ZIP."
            find "$ROOT" -maxdepth 4 -type f \
              -not -path '*/.git/*' | head -200
            exit 1
          fi

          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT"

      - name: Validate Android project
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::Root Gradle build file is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App Gradle build file is missing."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

          APK_DIR="app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory was not created."
            exit 1
          fi

          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" -print

          if ! find "$APK_DIR" -maxdepth 1 -type f \
               -name "*.apk" -print -quit | grep -q .; then
            echo "::error::Build finished without generating an APK."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueyBuddy-debug-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
