
name: ORBO Android APK Build

'on':
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ORBO APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ORBO source
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_ROOT="$GITHUB_WORKSPACE"

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 -type f \
            -name 'ORBO_Android_Project_Source.zip' \
            -not -path '*/.git/*' -print -quit)"

          if [ -n "$ZIP_FILE" ]; then
            unzip -tq "$ZIP_FILE"
            mkdir -p "$RUNNER_TEMP/orbo-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/orbo-source"
            SEARCH_ROOT="$RUNNER_TEMP/orbo-source"
          fi

          SETTINGS_FILE="$(find "$SEARCH_ROOT" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle file missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Java compatibility
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])

          for path in list(root.rglob("*.gradle")) + list(root.rglob("*.gradle.kts")):
              text = path.read_text(encoding="utf-8")
              fixed = text.replace(
                  "JavaVersion.VERSION_8",
                  "JavaVersion.VERSION_1_8"
              )
              if fixed != text:
                  path.write_text(fixed, encoding="utf-8")
                  print("Fixed:", path)
          PY

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_DIR/tools/verify_source.py" ]; then
            python3 "$PROJECT_DIR/tools/verify_source.py"
          else
            echo "Source verifier not present; continuing."
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          java -version
          gradle --version

          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Build and test APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon --stacktrace \
              clean testDebugUnitTest assembleDebug
          else
            gradle --no-daemon --stacktrace \
              clean testDebugUnitTest assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/ORBO-debug.apk"

          test -s "$GITHUB_WORKSPACE/dist/ORBO-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/dist/ORBO-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORBO-debug-apk
          path: dist/ORBO-debug.apk
          if-no-files-found: error
          retention-days: 14
