
name: Build Bluey Buddy APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f \
            -name 'BlueyBuddy-Android-Source-and-APK-Build*.zip' \
            ! -path './.git/*' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Android project ZIP nahi mili."
            find . -maxdepth 2 -type f
            exit 1
          fi

          echo "ZIP found: $ZIP"
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          PROJECT="$(find extracted -name settings.gradle \
            -type f -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle nahi mili."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          gradle_file = project / "app" / "build.gradle"

          if not gradle_file.exists():
              raise SystemExit(f"ERROR: File nahi mili: {gradle_file}")

          text = gradle_file.read_text()

          if "compileOptions {" not in text:
              text = text.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          """,
                  1
              )

          if "kotlinOptions {" not in text:
              text = text.replace(
                  "android {",
                  """android {
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          """,
                  1
              )

          gradle_file.write_text(text)
          print("Updated app/build.gradle:")
          print(text)
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK nahi bani."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueyBuddy-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
