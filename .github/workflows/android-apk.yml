name: Build Bluey Buddy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: "false"
          log-accepted-android-sdk-licenses: "false"
          packages: ""

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          echo "SDK license step completed."

      - name: Install required SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PROJECT=""

          for DIR in "$ROOT" "$ROOT/BlueyBuddy" "$ROOT/.build-source"; do
            if { [ -f "$DIR/settings.gradle" ] || \
                 [ -f "$DIR/settings.gradle.kts" ]; } && \
               { [ -f "$DIR/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ]; }; then
              PROJECT="$DIR"
              break
            fi
          done

          if [ -z "$PROJECT" ]; then
            mkdir -p "$ROOT/.build-source"

            for ZIP in \
              "$ROOT/BlueyBuddy-Android-Source.zip" \
              "$ROOT/BlueyBuddy-Fresh-Android-Source.zip" \
              "$ROOT/BlueyBuddy-Full-Offline-Source.zip"; do
              if [ -f "$ZIP" ]; then
                unzip -oq "$ZIP" -d "$ROOT/.build-source"
                break
              fi
            done

            PROJECT="$(find "$ROOT/.build-source" \
              -type f \( -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -print -quit | xargs -r dirname || true)"
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project not found. Check repository source files."
            find "$ROOT" -maxdepth 4 -type f \
              -not -path '*/.git/*' | head -200
            exit 1
          fi

          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT"

      - name: Validate project
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::Root Gradle build file is missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App Gradle build file is missing."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

          test -n "$(find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueyBuddy-debug-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
