name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ORBO_Android_Full_Source.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP and Android project folder
        shell: bash
        run: |
          set -euo pipefail
          echo "== Repo root files =="
          ls -la

          ZIP=""
          if [ -f "ORBO_Android_Full_Source.zip" ]; then
            ZIP="ORBO_Android_Full_Source.zip"
          else
            ZIP="$(ls -1 *.zip 2>/dev/null | head -n 1 || true)"
          fi

          SEARCH_ROOT="$GITHUB_WORKSPACE"
          if [ -n "$ZIP" ]; then
            echo "Using source ZIP: $ZIP"
            rm -rf "$GITHUB_WORKSPACE/_src"
            mkdir -p "$GITHUB_WORKSPACE/_src"
            unzip -q "$ZIP" -d "$GITHUB_WORKSPACE/_src"
            SEARCH_ROOT="$GITHUB_WORKSPACE/_src"
          else
            echo "Koi ZIP nahi mila; repo ke andar hi Android project dhundh raha hoon."
          fi

          SETTINGS="$(find "$SEARCH_ROOT" -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path "*/.git/*" -not -path "*/build/*" -not -path "*/docs/*" \
            | awk '{ print gsub("/","/") " " $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) nahi mila. ZIP incomplete hai ya galat folder structure hai."
            echo "== Files found =="
            find "$SEARCH_ROOT" -maxdepth 3 -not -path "*/.git/*" | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Android project folder: $PROJECT_DIR"

          MODULE=""
          for f in $(find "$PROJECT_DIR" -maxdepth 2 \( -name build.gradle.kts -o -name build.gradle \) \
              -not -path "$PROJECT_DIR/build.gradle" -not -path "$PROJECT_DIR/build.gradle.kts"); do
            if grep -q "android.application" "$f"; then
              MODULE="$(basename "$(dirname "$f")")"
              break
            fi
          done

          if [ -z "$MODULE" ]; then
            echo "::error::Application module (com.android.application) nahi mila."
            exit 1
          fi
          echo "Application module: $MODULE"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "MODULE=$MODULE" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          echo "SDK licenses accepted (non-interactive)."

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p "$GITHUB_WORKSPACE/logs"
          gradle --version
          gradle ":$MODULE:assembleDebug" --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log"

      - name: Run unit tests (failure APK ko nahi rokega)
        continue-on-error: true
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle ":$MODULE:testDebugUnitTest" --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/logs/unit-tests.log"

      - name: Verify APK actually exists
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PROJECT_DIR/$MODULE/build/outputs/apk/debug"
          echo "Looking in: $OUT"
          ls -la "$OUT" || true
          APK="$(find "$OUT" -maxdepth 1 -name "*.apk" 2>/dev/null | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "::error::Build chala par APK file nahi bani. logs/build.log artifact dekho."
            find "$PROJECT_DIR" -name "*.apk" -o -name "*.aab" | head -n 20
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/ORBO-debug.apk"
          ls -l "$GITHUB_WORKSPACE/dist/ORBO-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/dist/ORBO-debug.apk"
          unzip -l "$GITHUB_WORKSPACE/dist/ORBO-debug.apk" | grep -E "AndroidManifest.xml|classes.dex" || \
            { echo "::error::APK andar se valid nahi lag raha."; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ORBO-debug-apk
          path: dist/ORBO-debug.apk
          if-no-files-found: error

      - name: Upload build logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBO-build-logs
          path: |
            logs/
            _src/**/build/reports/
            _src/**/build/test-results/
          if-no-files-found: warn
