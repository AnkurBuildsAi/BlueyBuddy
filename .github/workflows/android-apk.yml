
name: Build Bluey Buddy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  build:
    name: Build Bluey Buddy Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f settings.gradle ] && [ -f app/build.gradle ]; then
            PROJECT="$GITHUB_WORKSPACE"
          else
            ZIP=""

            for candidate in \
              "$GITHUB_WORKSPACE/BlueyBuddy-Android-Source.zip" \
              "$GITHUB_WORKSPACE/BlueyBuddy-Fresh-Android-Source.zip" \
              "$GITHUB_WORKSPACE/BlueyBuddy-Full-Offline-Source.zip"; do
              if [ -f "$candidate" ]; then
                ZIP="$candidate"
                break
              fi
            done

            if [ -z "$ZIP" ]; then
              echo "Android project or supported source ZIP not found."
              find . -maxdepth 3 -type f -not -path './.git/*' -print
              exit 1
            fi

            mkdir -p .build-source
            unzip -q "$ZIP" -d .build-source

            PROJECT="$(find .build-source -name settings.gradle -type f -print -quit | xargs -r dirname)"

            if [ -z "$PROJECT" ] || [ ! -f "$PROJECT/app/build.gradle" ]; then
              echo "Valid Android Gradle project not found inside ZIP."
              exit 1
            fi
          fi

          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify project files
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/blueybuddy/agent/MainActivity.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/blueybuddy/agent/VirtualPetActivity.kt"
          test -f "$PROJECT_DIR/app/src/main/java/com/blueybuddy/agent/AgentEngine.kt"

          echo "Project file checks passed."

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace clean assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          echo "APK created successfully."
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueyBuddy-Android-8.1-debug-APK
          path: ${{ steps.source.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
