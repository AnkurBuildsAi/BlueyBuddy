
name: Build Bluey Buddy Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="./BlueyBuddy-Fresh-Android-Source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Source ZIP not found: $ZIP"
            find . -maxdepth 3 -type f -not -path './.git/*'
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted
          unzip -tq "$ZIP"
          unzip -q "$ZIP" -d extracted

          PROJECT="$(find extracted -name settings.gradle -type f -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT" ] || \
             [ ! -f "$PROJECT/build.gradle" ] || \
             [ ! -f "$PROJECT/app/build.gradle" ] || \
             [ ! -f "$PROJECT/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::Valid Android project not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            find app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK build successful"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueyBuddy-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
