name: Build Bluey Buddy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          if [ -f "$GITHUB_WORKSPACE/settings.gradle" ] && \
             [ -f "$GITHUB_WORKSPACE/app/build.gradle" ]; then
            PROJECT="$GITHUB_WORKSPACE"
          elif [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ] && \
               [ -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ]; then
            PROJECT="$GITHUB_WORKSPACE"
          else
            for ZIP in \
              "$GITHUB_WORKSPACE/BlueyBuddy-Android-Source.zip" \
              "$GITHUB_WORKSPACE/BlueyBuddy-Fresh-Android-Source.zip" \
              "$GITHUB_WORKSPACE/BlueyBuddy-Full-Offline-Source.zip"; do

              if [ -f "$ZIP" ]; then
                mkdir -p "$GITHUB_WORKSPACE/.build-source"
                unzip -oq "$ZIP" -d "$GITHUB_WORKSPACE/.build-source"
                break
              fi
            done

            PROJECT="$(find "$GITHUB_WORKSPACE/.build-source" \
              -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit 2>/dev/null | xargs -r dirname || true)"
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::Android Gradle project not found. Check the source files or ZIP."
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \
              -not -path '*/.git/*' | head -200
            exit 1
          fi

          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT"

      - name: Validate Android project
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/gradle.properties"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App Gradle build file not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "::error::Root Gradle build file not found."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

          APK="$(find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK generated: $APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueyBuddy-debug-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
