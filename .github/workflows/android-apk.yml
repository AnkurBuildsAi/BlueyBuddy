
name: Build Bluey Buddy Agent APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android source ZIP
        shell: bash
        run: |
          set -eu

          ZIP="./BlueyBuddy-Fresh-Android-Source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Source ZIP not found: $ZIP"
            find . -maxdepth 3 -type f -not -path './.git/*'
            exit 1
          fi

          unzip -tq "$ZIP"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          PROJECT="$(find extracted -name settings.gradle -type f -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT" ] || \
             [ ! -f "$PROJECT/app/build.gradle" ] || \
             [ ! -f "$PROJECT/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::Android project files are missing"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT"

      - name: Fix singleLine Kotlin compile error
        shell: bash
        run: |
          set -eu

          FILE="$PROJECT_DIR/app/src/main/java/com/blueybuddy/agent/MainActivity.kt"

          if [ ! -f "$FILE" ]; then
            echo "::error::MainActivity.kt not found: $FILE"
            exit 1
          fi

          sed -i 's/singleLine = true/setSingleLine(true)/g' "$FILE"

          if grep -n 'singleLine = true' "$FILE"; then
            echo "::error::singleLine compile error remains"
            exit 1
          fi

          echo "Kotlin singleLine fix checked."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eu
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: |
          set -eu
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            find app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueyBuddy-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
